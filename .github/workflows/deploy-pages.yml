name: Rust checks and Pages

on:
  push:
    branches: ["**"]
    tags: ["rust-v*"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "web/**"
      - "docs/**"
      - "scripts/**"
      - "examples/**"
      - ".github/workflows/deploy-pages.yml"
      - "LICENSE"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "web/**"
      - "docs/**"
      - "scripts/**"
      - "examples/**"
      - ".github/workflows/deploy-pages.yml"
      - "LICENSE"
  workflow_dispatch:

env:
  # check-packages validates this against the Cargo binary target.
  CLINKER_BINARY: clinker

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: clinker-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: clinker-macos-aarch64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: clinker-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: Match release tag to workspace version
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/rust-v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#rust-v}"
          workspace_version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "$tag_version" = "$workspace_version"
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Lint Rust
        if: runner.os == 'Linux'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test Rust workspace
        run: cargo test --locked --workspace
      - name: Build CLI
        run: cargo build --locked --release -p clinker-cli --target ${{ matrix.target }}
      - name: Package CLI (Unix)
        if: runner.os != 'Windows'
        working-directory: .
        run: |
          mkdir -p release/clinker
          cp "target/${{ matrix.target }}/release/$CLINKER_BINARY" release/clinker/
          cp LICENSE crates/clinker-cli/assets/LICENSE.* release/clinker/
          cp docs/cli.md release/clinker/README.md
          cp docs/project-format.md release/clinker/
          tar -C release -czf release/${{ matrix.archive }} clinker
          mkdir -p "$RUNNER_TEMP/clinker-archive"
          tar -xzf release/${{ matrix.archive }} -C "$RUNNER_TEMP/clinker-archive"
          cd "$RUNNER_TEMP/clinker-archive/clinker"
          "./$CLINKER_BINARY" --version
      - name: Package CLI (Windows)
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/clinker | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${env:CLINKER_BINARY}.exe" release/clinker/
          Copy-Item LICENSE release/clinker/
          Copy-Item docs/cli.md release/clinker/README.md
          Copy-Item docs/project-format.md release/clinker/
          Copy-Item crates/clinker-cli/assets/LICENSE.* release/clinker/
          Compress-Archive -Path release/clinker -DestinationPath release/${{ matrix.archive }}
          Expand-Archive release/${{ matrix.archive }} -DestinationPath "$env:RUNNER_TEMP/clinker-archive"
          Set-Location "$env:RUNNER_TEMP/clinker-archive/clinker"
          & "./${env:CLINKER_BINARY}.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/rust-v')
        with:
          name: ${{ matrix.archive }}
          path: release/${{ matrix.archive }}
          if-no-files-found: error

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and install extracted source packages
        run: node scripts/check-packages.mjs
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/rust-v')
        with:
          name: clinker-source-crates
          path: target/package-check/package/*.crate
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check JavaScript syntax
        run: |
          node --check web/src/app.js
          node --check web/src/worker.js
      - name: Test web workflows
        run: node --test web/tests/*.test.mjs
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build static web app
        run: sh web/build.sh
      - name: Test compiled WASM
        run: npm --prefix web run test:wasm
      - name: Install test browser
        run: cd web && npx playwright install --with-deps chromium firefox webkit
      - name: Package static application
        run: sh web/package.sh "$RUNNER_TEMP/clinker-web"
      - name: Test project editing and exports
        env:
          CLINKER_WEB_ROOT: ${{ runner.temp }}/clinker-web
        run: |
          for browser in chromium firefox webkit; do
            CLINKER_TEST_BROWSER="$browser" npm --prefix web run test:browser
          done
      - name: Verify embedded CLI plot assets
        run: npm --prefix web run check:assets
      - name: Package tested web release
        if: startsWith(github.ref, 'refs/tags/rust-v')
        run: |
          mkdir -p release
          tar -C "$RUNNER_TEMP" -czf release/clinker-web.tar.gz clinker-web
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/rust-v')
        with:
          name: clinker-web.tar.gz
          path: release/clinker-web.tar.gz
          if-no-files-found: error
      - name: Upload Pages artifact
        # TODO: change to master once Rust port is final
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/rust-port'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/clinker-web

  deploy:
    # TODO: change to master once Rust port is final
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/rust-port'
    needs: [native, web, packages]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  publish:
    if: startsWith(github.ref, 'refs/tags/rust-v')
    needs: [native, web, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Publish tested release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          cd release
          sha256sum -- ./*.tar.gz ./*.zip ./*.crate > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" ./* --notes-file ../docs/release-notes.md --generate-notes --verify-tag
