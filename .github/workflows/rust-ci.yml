name: Rust CI

on:
  push:
    paths:
      - "rust/**"
      - "examples/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "rust/**"
      - "examples/**"
      - ".github/workflows/rust-ci.yml"

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release -p clinker-cli

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rust/web/package-lock.json
      - run: cargo install wasm-pack --locked
      - run: sh web/build.sh
      - name: Verify embedded CLI plot assets
        run: |
          cmp web/d3.min.js crates/clinker-cli/assets/d3.min.js
          cmp web/clustermap.min.js crates/clinker-cli/assets/clustermap.min.js
      - run: node --check web/app.js
      - run: node --check web/worker.js
      - run: node --test web/tests/*.test.mjs
