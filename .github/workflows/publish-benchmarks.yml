name: Publish benchmark image

on:
  push:
    tags: ["benchmark-v[0-9]*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag (for example, 0.1.0)
        required: true
        default: "0.1.0"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set image metadata
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == push ]]; then
            tag="${REF_NAME#benchmark-v}"
          else
            tag="$INPUT_TAG"
          fi
          if [[ ! "$tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo 'Invalid container image tag' >&2
            exit 1
          fi
          image="ghcr.io/${OWNER,,}/clinker-benchmarks"
          revision="$(git rev-parse HEAD)"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: benchmarks/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
            org.opencontainers.image.version=${{ steps.image.outputs.tag }}

      - name: Report image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAG: ${{ steps.image.outputs.tag }}
          REVISION: ${{ steps.image.outputs.revision }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '## Benchmark image'
            echo
            echo "- Source commit: \`$REVISION\`"
            echo "- Image: \`$IMAGE:$TAG\`"
            echo "- Digest: \`$IMAGE@$DIGEST\`"
            echo '- Platform: `linux/amd64`'
          } >> "$GITHUB_STEP_SUMMARY"
