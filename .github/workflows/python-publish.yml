name: Publish Python maintenance release

on:
  push:
    tags:
      - "python-v*"

permissions:
  contents: read

concurrency:
  group: python-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a tag from Python maintenance history
        shell: bash
        run: |
          git fetch --no-tags origin refs/heads/python-maintenance:refs/remotes/origin/python-maintenance
          release_commit=$(git rev-parse "${GITHUB_REF}^{commit}")
          if ! git merge-base --is-ancestor "$release_commit" refs/remotes/origin/python-maintenance; then
            echo "::error::Python releases must be tagged from python-maintenance."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require the tag to match the package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import ast
          import os
          from pathlib import Path

          source = ast.parse(Path("clinker/__init__.py").read_text())
          versions = [
              ast.literal_eval(node.value)
              for node in source.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
          ]
          if len(versions) != 1 or not isinstance(versions[0], str) or not versions[0]:
              raise SystemExit("Expected one non-empty __version__ string in clinker/__init__.py")
          expected = f"python-v{versions[0]}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"Release tag must be {expected}")
          print(f"Publishing clinker {versions[0]} from Python maintenance history")
          PY

      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine

      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check --strict dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: python -m twine upload --non-interactive dist/*
