[package]
name = "clinker-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Native command-line interface for clinker"
include = ["src/**", "assets/**", "tests/**", "build.rs", "README.md", "LICENSE", "Cargo.toml"]
keywords = ["bioinformatics", "genomics", "visualization"]
categories = ["command-line-utilities", "science"]

[[bin]]
name = "clinker-rs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clinker-core = { path = "../clinker-core", version = "0.1.0" }
csv = "1"
serde_json = "1"
tiny_http = "0.12"
getrandom = "0.2"
