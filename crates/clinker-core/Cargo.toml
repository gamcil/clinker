[package]
name = "clinker-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Shared analysis core for clinker"

include = ["src/**", "examples/**", "tests/**", "README.md", "LICENSE", "Cargo.toml"]
keywords = ["bioinformatics", "genomics", "alignment"]
categories = ["science"]

[dependencies]
bio = "4"
gb-io = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"

[target.'cfg(target_arch = "aarch64")'.dependencies]
block-aligner = { version = "0.5", features = ["simd_neon"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
block-aligner = { version = "0.5", features = ["simd_wasm"] }
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(target_arch = "x86_64")'.dependencies]
block-aligner = { version = "0.5", features = ["simd_sse2"] }
